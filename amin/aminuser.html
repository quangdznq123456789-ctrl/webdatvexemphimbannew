<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quản lý tài khoản</title>

    <link
      rel="stylesheet"
      href="../bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;

        background:
          linear-gradient(rgba(10, 15, 30, 0.88), rgba(10, 15, 30, 0.88)),
          radial-gradient(circle at top right, #263a68, transparent 45%),
          radial-gradient(circle at bottom left, #18213b, transparent 45%),
          #0b1020;

        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;

        padding: 30px 18px;

        background: rgba(13, 17, 31, 0.96);
        border-right: 1px solid rgba(255, 255, 255, 0.08);

        z-index: 1000;
      }
      .logo {
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;

        margin-bottom: 40px;
        letter-spacing: 1px;
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .menu a {
        display: flex;
        align-items: center;

        width: 100%;
        padding: 13px 15px;

        color: #aeb7cc;
        text-decoration: none;

        border-radius: 10px;

        font-size: 14px;
        font-weight: 600;

        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .menu a:hover {
        color: #ffffff;
        background: rgba(63, 130, 255, 0.12);
        transform: translateX(3px);
      }

      .menu a.active {
        color: #ffffff;
        background: linear-gradient(
          135deg,
          rgba(63, 130, 255, 0.85),
          rgba(106, 92, 255, 0.85)
        );

        box-shadow: 0 8px 20px rgba(63, 130, 255, 0.15);
      }

      .logout {
        margin-top: 25px;

        border-top: 1px solid #374151;

        padding-top: 20px;
      }

      .logout a {
        color: #f87171;
      }

      .main-content {
        margin-left: 240px;

        min-height: 100vh;

        padding: 30px;
      }

      .page-header {
        display: flex;

        justify-content: space-between;
        align-items: center;

        margin-bottom: 25px;
      }

      .page-title {
        margin: 0;

        font-size: 30px;

        font-weight: bold;

        color: #f7f7f7;
      }

      .admin-info {
        background-color: white;

        padding: 10px 18px;

        border-radius: 8px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

        color: #374151;
      }

      .search-box {
        background-color: white;

        padding: 20px;

        border-radius: 10px;

        margin-bottom: 20px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .search-title {
        font-weight: bold;

        margin-bottom: 10px;

        color: #374151;
      }

      .search-row {
        display: flex;

        gap: 10px;
      }

      .search-row input {
        height: 45px;
      }

      .search-row button {
        min-width: 130px;
      }

      .table-container {
        background-color: white;

        border-radius: 10px;

        padding: 20px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

        overflow-x: auto;
      }

      .account-table {
        margin: 0;

        vertical-align: middle;

        min-width: 950px;
      }

      .account-table thead th {
        background-color: #111827;

        color: white;

        padding: 14px 12px;

        white-space: nowrap;
      }

      .account-table tbody td {
        padding: 14px 12px;
      }

      .account-table tbody tr {
        transition: 0.15s;
      }

      .account-table tbody tr:hover {
        background-color: #f8fafc;
      }

      .status-active {
        display: inline-block;

        padding: 5px 10px;

        border-radius: 20px;

        background-color: #dcfce7;

        color: #166534;

        font-size: 13px;

        font-weight: bold;
      }

      .status-locked {
        display: inline-block;

        padding: 5px 10px;

        border-radius: 20px;

        background-color: #fee2e2;

        color: #c03a3a;

        font-size: 13px;

        font-weight: bold;
      }

      .role-admin {
        display: inline-block;

        padding: 5px 10px;

        border-radius: 20px;

        background-color: #dbeafe;

        color: #1e40af;

        font-size: 13px;

        font-weight: bold;
      }

      .role-user {
        display: inline-block;

        padding: 5px 10px;

        border-radius: 20px;

        background-color: #f3f4f6;

        color: #374151;

        font-size: 13px;

        font-weight: bold;
      }

      .action-buttons {
        display: flex;

        gap: 6px;

        white-space: nowrap;
      }

      .action-buttons button {
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .sidebar {
          width: 200px;
        }

        .main-content {
          margin-left: 200px;
        }

        .page-header {
          flex-direction: column;

          align-items: flex-start;

          gap: 15px;
        }
      }

      @media (max-width: 650px) {
        .sidebar {
          position: relative;

          width: 100%;

          height: auto;
        }

        .main-content {
          margin-left: 0;

          padding: 20px;
        }

        .search-row {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <aside class="sidebar">
      <div class="logo">ADMIN QUẢN LÝ</div>

      <nav class="menu">
        <a href="./amintrangchu.html"> Quản lý phim </a>

        <a href="./amintheloai.html"> Quản lý thể loại </a>

        <a href="./aminuser.html" class="active"> Quản lý tài khoản </a>

        <a href="./amindoanhthu.html"> Quản lý doanh thu </a>
      </nav>

      <div class="menu logout">
        <a href="../index.html"> Đăng xuất </a>
      </div>
    </aside>

    <main class="main-content">
      <!-- HEADER -->

      <div class="page-header">
        <h1 class="page-title">Quản lý tài khoản</h1>

        <div class="admin-info">
          👤
          <strong> Quản trị viên </strong>
        </div>
      </div>

      <!-- SEARCH -->

      <div class="search-box">
        <div class="search-title">Tìm kiếm tài khoản</div>

        <div class="search-row">
          <input
            type="text"
            id="searchAccount"
            class="form-control"
            placeholder="Nhập họ tên hoặc số điện thoại..."
          />

          <button type="button" id="searchButton" class="btn btn-primary">
            🔍 TÌM KIẾM
          </button>
          <button
            type="button"
            onclick="themTaiKhoan()"
            class="btn btn-primary"
          >
            Thêm tài khoản
          </button>
        </div>
      </div>

      <!-- TABLE -->

      <div class="table-container">
        <table class="table table-bordered account-table">
          <thead>
            <tr>
              <th>STT</th>

              <th>Họ tên</th>

              <th>Số điện thoại</th>

              <th>Vai trò</th>

              <th>Ngày tạo</th>

              <th>Trạng thái</th>

              <th>Thao tác</th>
            </tr>
          </thead>

          <tbody id="accountList">
            <!--
                        aminuser.js
                        sẽ đưa dữ liệu vào đây
                    -->
          </tbody>
        </table>
      </div>
    </main>

    <script src="../bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <script src="./aminuser.js"></script>
  </body>
</html>
